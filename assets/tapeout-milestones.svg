<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc">
  <title id="title">TapeOut 2026 — Official Milestones</title>
  <desc id="desc">一条连续时间轴展示 TapeOut 官方里程碑，节点按协议、计算和生态分类。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08090d"/><stop offset=".55" stop-color="#10131a"/><stop offset="1" stop-color="#0b0d12"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#83f6d2"/><stop offset=".48" stop-color="#70b9ff"/><stop offset="1" stop-color="#f0a7ff"/></linearGradient>
    <linearGradient id="beam2" x1="0" x2="1"><stop stop-color="#d8fff4"/><stop offset=".5" stop-color="#b4d7ff"/><stop offset="1" stop-color="#ffe2fb"/></linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="smallGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
    <style>
      .sans{font-family:Inter,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif}.mono{font-family:"SFMono-Regular",Consolas,monospace}
      .kicker{font-size:15px;letter-spacing:.34em;fill:#8ff4da}.title{font-size:76px;font-weight:760;letter-spacing:-.055em;fill:#f5f7fb}.subtitle{font-size:22px;fill:#9aa5b8}.meta{font-size:13px;letter-spacing:.2em;fill:#707b8e}.date{font-size:13px;letter-spacing:.16em;fill:#94a0b3}.name{font-size:22px;font-weight:700;fill:#f4f6fa}.minor{font-size:16px;font-weight:650;fill:#dde3ed}.detail{font-size:13px;fill:#818da0}.cat{font-size:11px;letter-spacing:.16em;font-weight:700}.foot{font-size:12px;letter-spacing:.1em;fill:#5f6878}
    </style>
  </defs>
  <rect width="1800" height="1200" fill="url(#bg)"/><rect width="1800" height="1200" fill="url(#grid)"/>
  <path d="M0 208H1800M0 1015H1800" stroke="#fff" stroke-opacity=".08"/>
  <circle cx="1590" cy="150" r="310" fill="#8067ff" opacity=".055"/><circle cx="90" cy="1050" r="260" fill="#39e6c0" opacity=".035"/>
  <text x="104" y="92" class="sans kicker">TAPEOUT PROTOCOL / OFFICIAL ARCHIVE</text>
  <text x="98" y="177" class="sans title">A MACHINE</text>
  <text x="98" y="247" class="sans title" fill="url(#beam2)">BECOMES PUBLIC</text>
  <text x="104" y="294" class="sans subtitle">TapeOut 2026 · 从一枚逻辑门，到一台所有人都能访问的机器</text>
  <text x="1595" y="92" text-anchor="end" class="mono meta">TIMELINE / 2026.08—2026.10</text>
  <text x="1595" y="118" text-anchor="end" class="mono meta">13 MILESTONES · 03 CATEGORIES</text>
  <path d="M110 810 C430 795 635 730 860 670 S1285 520 1760 280" fill="none" stroke="#0a0c10" stroke-width="18" opacity=".9"/>
  <path d="M110 810 C430 795 635 730 860 670 S1285 520 1760 280" fill="none" stroke="url(#beam)" stroke-width="3" opacity=".85"/>
  <path d="M110 810 C430 795 635 730 860 670 S1285 520 1760 280" fill="none" stroke="url(#beam2)" stroke-width="1" opacity=".8" stroke-dasharray="2 11"/>
  <text x="112" y="866" class="mono meta">ORIGIN</text><text x="1760" y="238" text-anchor="end" class="mono meta">NEXT / ITO ERA</text>
  <g class="sans">
    <g transform="translate(220 801)"><circle r="7" fill="#70b9ff" stroke="#d8efff" stroke-width="2" filter="url(#smallGlow)"/><text x="-2" y="38" class="mono date">08.15</text><text x="-2" y="61" class="minor">4 位 CPU 发布</text></g>
    <g transform="translate(365 783)"><circle r="6" fill="#83f6d2"/><text x="0" y="-28" class="mono date">08.15</text><text x="0" y="-8" class="minor">Protocol Alpha 启动</text></g>
    <g transform="translate(505 752)"><circle r="6" fill="#83f6d2"/><text x="0" y="38" class="mono date">08.20</text><text x="0" y="61" class="minor">PoD 题库与公式公开</text></g>
    <g transform="translate(650 721)"><circle r="8" fill="#70b9ff" stroke="#d8efff" stroke-width="2" filter="url(#smallGlow)"/><path d="M0 -8V-72" stroke="#70b9ff" stroke-opacity=".65"/><text x="14" y="-84" class="mono date">08.23</text><text x="14" y="-60" class="name">BNN 原型上线</text><text x="14" y="-39" class="detail">二值神经网络 · 推理上链</text><text x="14" y="-16" class="cat" fill="#70b9ff">COMPUTE</text></g>
    <g transform="translate(805 686)"><circle r="6" fill="#83f6d2"/><text x="0" y="38" class="mono date">09.01</text><text x="0" y="61" class="minor">公平机制升级发布</text></g>
    <g transform="translate(952 650)"><circle r="7" fill="#70b9ff" stroke="#d8efff" stroke-width="2" filter="url(#smallGlow)"/><path d="M0 8V78" stroke="#70b9ff" stroke-opacity=".65"/><text x="14" y="105" class="mono date">09.05</text><text x="14" y="130" class="name">电路容器上线</text><text x="14" y="151" class="detail">资产 · RAM · 合约权限</text><text x="14" y="174" class="cat" fill="#70b9ff">STATE</text></g>
    <g transform="translate(1090 614)"><circle r="8" fill="#70b9ff" stroke="#d8efff" stroke-width="2" filter="url(#smallGlow)"/><path d="M0 -8V-72" stroke="#70b9ff" stroke-opacity=".65"/><text x="14" y="-84" class="mono date">09.07</text><text x="14" y="-60" class="name">链上 Linux 发布</text><text x="14" y="-39" class="detail">RISC-V · L1 指令推进</text><text x="14" y="-16" class="cat" fill="#70b9ff">COMPUTE</text></g>
    <g transform="translate(1228 574)"><circle r="6" fill="#f5ad78"/><text x="0" y="40" class="mono date">09.10</text><text x="0" y="63" class="minor">UPay 接入 TapeOut</text></g>
    <g transform="translate(1368 525)"><circle r="6" fill="#f5ad78"/><text x="0" y="40" class="mono date">09.15</text><text x="0" y="63" class="minor">TapeHub.ai 上线</text></g>
    <g transform="translate(1510 465)"><circle r="6" fill="#f5ad78"/><text x="0" y="-28" class="mono date">09.19</text><text x="0" y="-8" class="minor">X Layer 主网上线</text></g>
    <g transform="translate(1540 415)"><circle r="8" fill="#83f6d2" stroke="#e2fff8" stroke-width="2" filter="url(#smallGlow)"/><path d="M0 -8V-72" stroke="#83f6d2" stroke-opacity=".65"/><text x="-18" y="-84" text-anchor="end" class="mono date">09.30</text><text x="-18" y="-60" text-anchor="end" class="name">TAPs 协议标准发布</text><text x="-18" y="-39" text-anchor="end" class="detail">TAP-01 · TAP-10 · DeWEB 互操作规范</text><text x="-18" y="-16" text-anchor="end" class="cat" fill="#83f6d2">PROTOCOL</text></g>
    <g transform="translate(1615 375)"><circle r="6" fill="#f0a7ff"/><text x="-12" y="-25" text-anchor="end" class="mono date">09.30</text><text x="-12" y="-6" text-anchor="end" class="minor">桌面客户端预告</text></g>
    <g transform="translate(1680 325)"><circle r="7" fill="#f0a7ff"/><text x="-16" y="-24" text-anchor="end" class="mono date">10.04</text><text x="-16" y="-4" text-anchor="end" class="minor">官网上线 · BEM 跨链</text></g>
    <g transform="translate(1755 265)"><circle r="12" fill="#f5ad78" stroke="#fff0df" stroke-width="2" filter="url(#glow)"/><path d="M0 12V72" stroke="#f5ad78" stroke-opacity=".75"/><text x="-24" y="98" text-anchor="end" class="mono date">10.05</text><text x="-24" y="123" text-anchor="end" class="name">ITO 概念与路线图</text><text x="-24" y="144" text-anchor="end" class="detail">可验证项目发行 · 未来 60 天</text><text x="-24" y="167" text-anchor="end" class="cat" fill="#f5ad78">NEXT / ITO</text></g>
  </g>
  <g transform="translate(104 960)" class="sans"><text class="mono meta" y="0">READ THE SIGNAL</text><circle cx="5" cy="35" r="5" fill="#83f6d2"/><text x="20" y="40" class="detail">协议与信任</text><circle cx="145" cy="35" r="5" fill="#70b9ff"/><text x="160" y="40" class="detail">计算与状态</text><circle cx="290" cy="35" r="5" fill="#f5ad78"/><text x="305" y="40" class="detail">生态与入口</text><text x="0" y="90" class="sans subtitle" font-size="19">公开规则 → 可验证执行 → 可互操作的机器</text></g>
  <text x="1695" y="1088" text-anchor="end" class="mono foot">SOURCE: OFFICIAL ANNOUNCEMENTS &amp; PUBLIC RECORDS · ALL TIMES UTC</text><text x="104" y="1088" class="mono foot">TAPEOUT / 2026</text>
</svg>
